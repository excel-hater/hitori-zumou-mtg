<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ひとり朝会</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="app.js">
<link rel="modulepreload" href="core.js">
<link rel="modulepreload" href="script.js">
<link rel="modulepreload" href="responder.js">
<link rel="modulepreload" href="export.js">
<link rel="modulepreload" href="storage.js">
</head>
<body>
<div class="app">
  <header class="bar">
    <h1 id="date">ひとり朝会</h1>
    <button type="button" id="export-btn">書き出し</button>
    <button type="button" id="reset-btn">やり直し</button>
  </header>
  <p id="notice" class="notice" hidden>このブラウザでは記録が保存されません</p>
  <section id="export" class="export" hidden>
    <textarea id="export-text" rows="8" readonly aria-label="書き出す内容"></textarea>
    <p id="export-msg" class="export-msg" role="status"></p>
    <div class="row">
      <button type="button" id="copy-btn">コピー</button>
      <button type="button" id="download-btn">ダウンロード</button>
      <button type="button" id="close-btn">閉じる</button>
    </div>
  </section>
  <main id="log" class="log" role="log" aria-live="polite"></main>
  <form id="form" class="input">
    <textarea id="text" rows="1" placeholder="ここに入力（Enter で送信、Shift+Enter で改行）" aria-label="メッセージ" enterkeyhint="send"></textarea>
    <button type="submit" id="send">送信</button>
  </form>
</div>
<noscript>JavaScript を有効にしてください。</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
